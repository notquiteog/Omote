name: desktop chat UI

on:
  push:
    branches: [main]
    paths:
      - 'omote/static/**'
      - 'omote/providers/**'
      - 'omote/routers/agent.py'
      - 'omote/routers/providers.py'
      - 'tests/test_workspace_browser.py'
      - 'tests/test_onboarding_browser.py'
      - 'tests/test_chat_controls_*.py'
      - 'tests/test_update_browser.py'
      - 'tests/test_tasks_browser.py'
      - 'tests/test_results_browser.py'
      - 'tests/test_schedules_browser.py'
      - 'omote/routers/schedules.py'
      - 'omote/results.py'
      - 'omote/routers/media.py'
      - '.github/workflows/ui.yml'
  pull_request:
    paths:
      - 'omote/static/**'
      - 'omote/providers/**'
      - 'omote/routers/agent.py'
      - 'omote/routers/providers.py'
      - 'tests/test_workspace_browser.py'
      - 'tests/test_onboarding_browser.py'
      - 'tests/test_chat_controls_*.py'
      - 'tests/test_update_browser.py'
      - 'tests/test_tasks_browser.py'
      - 'tests/test_results_browser.py'
      - 'tests/test_schedules_browser.py'
      - 'omote/routers/schedules.py'
      - 'omote/results.py'
      - 'omote/routers/media.py'
      - '.github/workflows/ui.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: chat-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chat-ui:
    name: chat UI (${{ matrix.os }}, ${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            browser: chromium
          - os: windows-latest
            browser: chromium
          - os: macos-15
            browser: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      OMOTE_TEST_BROWSER: ${{ matrix.browser }}
      OMOTE_TEST_BROWSER_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the app and browser test dependencies
        run: python -m pip install -e '.[dev,browser]'
      - name: Install the browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Provider requests, model and reasoning controls, setup and updates
        run: python -m pytest -q tests/test_chat_controls_providers.py tests/test_reasoning.py tests/test_reasoning_dialects.py tests/test_chat_controls_browser.py tests/test_onboarding_browser.py tests/test_update_browser.py tests/test_git_responsiveness.py tests/test_tasks_browser.py tests/test_schedules_browser.py tests/test_results_browser.py
