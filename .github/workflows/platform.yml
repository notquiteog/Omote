name: core platform regressions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Chat, voice, hooks and desktop platform boundaries
        run: python -m pytest -q tests/test_chat_retries.py tests/test_openrouter.py tests/test_agent.py tests/test_hooks.py tests/test_stage.py tests/test_win32_stage.py tests/test_vad.py tests/test_voice.py tests/test_voice_inheritance.py tests/test_sessions.py tests/test_voice_answers.py tests/test_realtime_protocol.py
