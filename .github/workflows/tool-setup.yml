name: local tool setup
on:
  pull_request:
    paths:
      - 'omote/setup/**'
      - 'omote/routers/setup.py'
      - 'omote/agent/browsers.py'
      - 'desktop/sidecar/**'
      - 'desktop/ci/tool_setup_smoke.py'
      - 'tests/test_tool_setup*'
      - '.github/workflows/tool-setup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-setup:
    name: private setup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app without browser extras or external Python tools
        run: python -m pip install -e '.[dev]' pyinstaller==6.22.2
      - name: Setup and ownership regressions
        run: python -m pytest -q tests/test_tool_setup.py
      - name: Build the actual frozen desktop daemon
        run: python -m PyInstaller --noconfirm --clean --distpath setup-dist --workpath setup-build desktop/sidecar/omote-daemon.spec
      - name: Install, configure and test through the frozen app
        shell: bash
        run: |
          daemon=setup-dist/omote-daemon
          if [[ "$RUNNER_OS" == "Windows" ]]; then daemon="$daemon.exe"; fi
          python desktop/ci/tool_setup_smoke.py --daemon "$daemon" --data setup-smoke-data
      - name: Keep setup diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: setup-diagnostics-${{ matrix.os }}
          path: |
            setup-smoke-data/daemon.log
            setup-smoke-data/tools/setup/state.json
            setup-smoke-data/*.png
